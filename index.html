<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
</head>
<body>
    <div class="container">
        <div class="start screen" id ="start-screen">
            <h1>Quiz Game!</h1>
            <p>Test your knowledge with this fun questions</p>
            <button id="start-btn">Start Quiz</button>
        </div>
        <div class="screen" id="quiz-screen">
            <div class="quiz-header">
                <h2 id="question-text">Question goes here</h2>
                <div class="quiz-info">
                    <p>Question <span id="current-question">1</span> of <span>10</span></p>
                    <p>Score: <span id="score">0</span></p>
                </div>
                <div id="answers-container" class="answers-container">
                    <!-- Answer buttons will be inserted here from our js at some point -->
                </div>
                <div class="progress-bar">
                    <div id="progress" class="progress"></div>
                </div>
            </div>
            <div id="result-screen" class="screen">
                <h1>Quiz Results</h1>
                <div class="result-info">
                    <p>Your final score is: <span id="final-score">0</span>out of <span id="max-score">10</span></p>
                    <div id="result-message">Good job!</div>

                </div>
                    <button id="restart-btn">Restart Quiz</button>
            </div>
        </div>
    </div>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="container">
      <div class="screen active" id="start-screen"></div>
        </div>
    
</body>
</html>
